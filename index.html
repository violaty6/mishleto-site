<style>
  /* Intro: the letters settle in and the cat curls up. Afterwards the cat breathes and z's drift
     up every 9 seconds. Hovering the cat (when the SVG is inline) wakes it: z's vanish, it stretches. */
  .ml-l, .ml-catin, .ml-cat { transform-box: fill-box; transform-origin: 50% 100%; }
  .ml-l { animation: ml-settle .9s cubic-bezier(.25, .8, .3, 1) both; }
  .ml-catin { animation: ml-doze 1s ease-out 1s both; }
  .ml-cat { animation: ml-breathe 3.6s ease-in-out 2s infinite; }
  .ml-z { opacity: 0; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: 0 100%;
          animation: ml-zz 9s ease-in-out 1.8s infinite; }
  .ml-z1 { stroke-width: 5.5; }
  .ml-z2 { stroke-width: 7; animation-delay: 2.3s; }
  .ml-z3 { stroke-width: 8.5; animation-delay: 2.8s; }
  .ml-zs { transition: opacity .25s; }
  .ml-hit { fill: transparent; }
  .ml-catzone:hover .ml-zs { opacity: 0; }
  .ml-catzone:hover .ml-cat { animation: ml-stretch 1.1s ease-in-out both; }
  @keyframes ml-settle { 0% { opacity: 0; transform: translateY(14%); } 100% { opacity: 1; transform: none; } }
  @keyframes ml-doze { 0% { opacity: 0; transform: scaleY(.6); } 60% { opacity: 1; transform: scaleY(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes ml-breathe { 0%, 100% { transform: none; } 50% { transform: scale(1.01, 1.035); } }
  @keyframes ml-zz {
    0%        { opacity: 0; transform: translate(0, 0) scale(.5); }
    6%, 19%   { opacity: 1; }
    27%, 100% { opacity: 0; transform: translate(14px, -18px) scale(1.1); }
  }
  @keyframes ml-stretch {
    0%        { transform: none; }
    30%       { transform: scale(1.08, .92); }
    55%       { transform: translateY(-7%) scale(.98, 1.05); }
    75%, 100% { transform: none; }
  }
</style>
